<html>
<head>
  <title>PubkeySollet</title>
  <style type="text/css">
    body {
      min-width: 600px;
      margin: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 1.5em;
      font-weight: bold;
    }
    .toggle-group {
      display: flex;
      gap: 10px;
    }
    .toggle-btn {
      border: 0px solid #004C99;
      background: lightgray;
      color: dimgray;
      padding: 8px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }
    .toggle-btn.selected, .toggle-btn:checked {
      background: limegreen;
      color: #fff;
    }
    #save {
      border: 1px solid #004C99;
      padding: 10px;
      border-radius: 5px;
      background-color: #004C99;
      color: white;
      width: 100%;
      cursor: pointer;
    }
    #save:hover {
      background-color: #0055CC;
    }
    #save:active {
    	-webkit-transform: translate(0,2px);
    	-moz-transform: translate(0,2px);
    	transform: translate(0,2px);
    }
    #save:disabled {
      cursor: default;
    }
    .content-section {
      margin-top: 10px;
      height: 400px;
      background: #fafbfc;
      padding: 10px;
      overflow-y: auto;
    }
    .hidden {
      display: none;
    }
    .transactions-frame {
      text-align: center;
      color: #888;      
    }
  </style>
  <script type="text/javascript" src="js/popup.js"></script>
</head>
<body id="pubkeysollet-popup-body">
<div class="header">

  <div class="toggle-group">
